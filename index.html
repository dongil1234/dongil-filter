<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="필터프레스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="dash.css">
<link rel="stylesheet" href="shell.css">
<title>필터프레스 선정·판정</title>
</head>
<body>
<div id="app" hidden></div>

<div id="boot">
  <header class="appbar"><div class="row"><img class="logo" src="logo.png" alt="DONGIL"><span class="title">필터프레스 선정·판정</span></div></header>
  <main>
    <section class="card" id="lock" hidden>
      <h2>직원 비밀번호</h2>
      <p class="muted small">처음 한 번만 넣습니다. 이 휴대폰에 기억되고, 그다음부터는 인터넷 없이 열립니다.</p>
      <form id="lock-form" autocomplete="off">
        <label class="f">비밀번호<input id="code" type="password" autocomplete="current-password" required></label>
        <div class="msg" id="lock-msg" hidden></div>
        <button class="btn primary block" id="lock-btn" type="submit">열기</button>
      </form>
    </section>
    <section class="card" id="status">
      <p id="status-text">앱을 준비하는 중…</p>
      <div class="progress"><div id="progress-bar"></div></div>
      <p class="hint" id="status-hint">처음 열 때는 앱 파일(약 20 MB)을 휴대폰에 저장하느라 Wi-Fi에서 1분쯤 걸립니다. 그다음부터는 인터넷 없이 열립니다.</p>
    </section>
  </main>
</div>

<div id="busy" hidden><div class="busy-box"><div class="spinner"></div><span id="busy-text">계산 중…</span></div></div>
<div id="toast" hidden><span id="toast-text"></span><button type="button" id="toast-btn" hidden></button></div>

<!-- 확인 창(나가기·저장 덮어쓰기·지우기) -->
<div id="dialog" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-text">
    <h3 id="dlg-title"></h3>
    <p id="dlg-text"></p>
    <div class="dlg-btns"><button type="button" id="dlg-cancel">취소</button><button type="button" id="dlg-ok">확인</button></div>
  </div>
</div>

<!-- 저장한 입력 목록(불러오기) -->
<div id="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><b id="sheet-title">저장한 입력</b><button type="button" id="sheet-close">닫기</button></div>
    <p class="sheet-note">이 휴대폰에만 저장됩니다(앱을 나가도 남음). 앱을 지우거나 브라우저 저장 공간을 비우면 함께 지워집니다.</p>
    <ul id="sheet-list"></ul>
  </div>
</div>

<script src="pyodide/314.0.7/pyodide.js"></script>
<script src="dash.js"></script>
<script src="app.js"></script>
</body>
</html>
